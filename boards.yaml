# The virtual boards Studio offers. A board is its Devicetree (athrill-device
# boards/), the Athrill target that runs it, and the firmware it can start.
# Paths are relative to this repository (tools/fetch.sh fills work/).
boards:
  - id: nucleo-f767zi
    title: ST NUCLEO-F767ZI
    soc: STM32F767ZI (Cortex-M7, 216 MHz)
    athrill: work/athrill3-stm32/athrill3
    devicetree: work/athrill-device/boards/nucleo-f767zi/nucleo-f767zi.dtb
    cpu_mhz: 216
    memory:
      - ROM, 0x08000000, 2048
      - RAM, 0x20000000, 512
    device_config:
      - DEBUG_FUNC_ENABLE_SKIP_CLOCK 1
      - DEVICE_CONFIG_STM32_BOOT_ADDR 0x08000000
      - DISABLE_SYMBOL_UNDERSCORE 1
      - DEVICE_CONFIG_STM32_CONSOLE_UART 3
    firmware:
      - id: zephyr-hello-world
        title: Zephyr hello_world
        elf: work/zephyr-stm32/hello_world-nucleo_f767zi.elf
        seconds: 2
      - id: zephyr-synchronization
        title: Zephyr synchronization (two threads, semaphores)
        elf: work/zephyr-stm32/synchronization-nucleo_f767zi.elf
        seconds: 10
      - id: zephyr-philosophers
        title: Zephyr philosophers (six threads, mutexes)
        elf: work/zephyr-stm32/philosophers-nucleo_f767zi.elf
        seconds: 60
  - id: nucleo-h743zi
    title: ST NUCLEO-H743ZI
    soc: STM32H743ZI (Cortex-M7, 480 MHz)
    athrill: work/athrill3-stm32/athrill3
    devicetree: work/athrill-device/boards/nucleo-h743zi/nucleo-h743zi.dtb
    cpu_mhz: 480
    memory:
      - ROM, 0x08000000, 2048
      - RAM, 0x00000000, 64
      - RAM, 0x20000000, 128
      - RAM, 0x24000000, 512
      - RAM, 0x30000000, 288
      - RAM, 0x38000000, 64
      - RAM, 0x38800000, 4
    device_config:
      - DEBUG_FUNC_ENABLE_SKIP_CLOCK 1
      - DEVICE_CONFIG_STM32_BOOT_ADDR 0x08000000
      - DISABLE_SYMBOL_UNDERSCORE 1
      - DEVICE_CONFIG_STM32_CONSOLE_UART 3
    firmware:
      - id: zephyr-hello-world
        title: Zephyr hello_world
        elf: work/zephyr-stm32/hello_world-nucleo_h743zi.elf
        seconds: 2
      - id: zephyr-synchronization
        title: Zephyr synchronization (two threads, semaphores)
        elf: work/zephyr-stm32/synchronization-nucleo_h743zi.elf
        seconds: 10
      - id: zephyr-philosophers
        title: Zephyr philosophers (six threads, mutexes)
        elf: work/zephyr-stm32/philosophers-nucleo_h743zi.elf
        seconds: 60
  - id: pixhawk4
    title: Holybro Pixhawk 4 (FMUv5)
    soc: STM32F765 (Cortex-M7, 216 MHz)
    athrill: work/athrill3-stm32/athrill3
    # the board with the Hakoniwa sensor device as the source of the chips' samples
    devicetree: work/athrill-device/boards/pixhawk4/pixhawk4-hakoniwa.dtb
    cpu_mhz: 216
    memory:
      - ROM, 0x08000000, 2048
      - RAM, 0x20000000, 512
    device_config:
      - DEBUG_FUNC_ENABLE_SKIP_CLOCK 1
      - DEVICE_CONFIG_STM32_BOOT_ADDR 0x08008000
      - DISABLE_SYMBOL_UNDERSCORE 1
      - DEVICE_CONFIG_STM32_CONSOLE_UART 7
    firmware:
      # PX4 flies the Hakoniwa Drone x500, whose physics and sensors run inside
      # Athrill (the in-process sensor device; tools/setup-drone.sh). PX4's own
      # drivers read the emulated chips; MAVLink on TELEM1 (TCP 5760).
      - id: px4-x500
        title: PX4 v1.17.0 flying the Hakoniwa Drone x500 (in process)
        elf: work/download/px4_fmu-v5_default.elf
        seconds: 0
        cwd: work/drone/drone-core
        copy: [work/drone/seed/fram.bin, work/drone/seed/sd.img]
        mavlink: tcp:127.0.0.1:5760
        device_config:
          - DEVICE_CONFIG_STM32_FRAM_FILE {run}/fram.bin
          - DEVICE_CONFIG_STM32_SDCARD_IMAGE {run}/sd.img
          - DEVICE_CONFIG_STM32_UART2_TCP_PORT 5760
          - HAKO_SENSOR_DEVICE_IRQ 1000
          - DEVICE_CONFIG_DEVICE_PLUGIN_0 hakoniwa%2Csensor-device={root}/work/drone/lib/libhako_sensor_device_inproc.dylib
          - HAKO_AIRCRAFT_CONFIG_PATH {root}/work/drone/airframe
          - HAKO_AIRCRAFT_WORKER 1
  - id: pixhawk6c
    title: Holybro Pixhawk 6C
    soc: STM32H743 (Cortex-M7, 480 MHz)
    devicetree: work/athrill-device/boards/pixhawk6c/pixhawk6c.dtb
    firmware: []
